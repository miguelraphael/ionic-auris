name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK with platform 35 and
      # build-tools 35.0.0, and exports ANDROID_HOME. The setup-android action
      # is unnecessary (and failed here), so only install the packages if a
      # future image drops them.
      - name: Ensure Android SDK 35
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI has no local.properties. Reject missing runtime configuration instead
      # of publishing an APK that crashes on launch. Only use the client anon key.
      - name: Validate app configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::$name is missing. Configure it in repository Actions variables or secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build debug APK and run unit tests
        env:
          ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: >
          ./gradlew :app:assembleDebug :app:testDebugUnitTest
          --no-daemon
          --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: auris-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish preview release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: auris-debug-apk
          path: release

      - name: Name APK and calculate checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mv release/app-debug.apk "release/auris-${RELEASE_TAG}-debug.apk"
          cd release
          sha256sum "auris-${RELEASE_TAG}-debug.apk" > "auris-${RELEASE_TAG}-debug.apk.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.apk release/*.sha256 \
            --verify-tag --title "Auris $RELEASE_TAG (preview)" \
            --prerelease --generate-notes --notes-file docs/RELEASE_NOTES.md

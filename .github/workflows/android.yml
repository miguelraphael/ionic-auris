name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK with platform 35 and
      # build-tools 35.0.0, and exports ANDROID_HOME. The setup-android action
      # is unnecessary (and failed here), so only install the packages if a
      # future image drops them.
      - name: Ensure Android SDK 35
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Supabase values are optional for a green build: the fields compile to empty
      # strings and are only needed at runtime. Set them as repository variables if
      # you want CI-built APKs to be usable. Never put a service_role key here —
      # only the anon key belongs in a client. Gradle reads ORG_GRADLE_PROJECT_*
      # as project properties, so the values stay out of the command line.
      - name: Build debug APK and run unit tests
        env:
          ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: >
          ./gradlew :app:assembleDebug :app:testDebugUnitTest
          --no-daemon
          --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: auris-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

# ==============================================================================
# Memory configuration
# ==============================================================================
#
# Tuned for a 15 GB machine (Ryzen 7 5700U, 8c/16t, 15 GB zram swap, CachyOS).
#
# ## Why this file looks the way it does
#
# R8 does not merely allocate heap. On a release build of this app it needs roughly
# 4-6 GB of heap *plus* a comparable amount of native memory for the object graph, string
# tables and output buffers. Three things then combine on a machine this size to produce a
# hard lock-up rather than a slow build:
#
# 1. **Worker multiplication.** `org.gradle.workers.max` defaults to the core count. On a
#    16-thread CPU that lets Gradle run up to 16 heap-allocating tasks concurrently. R8,
#    D8 and the Kotlin daemon each want gigabytes, so peak demand lands well above 40 GB
#    on a 15 GB machine.
#
# 2. **GC choice.** G1 keeps region metadata, remembered sets and a young-generation reserve
#    in *native* memory, outside `-Xmx`. That native footprint is invisible in the heap
#    setting and is the part that pushes the kernel into reclaim. SerialGC has a much
#    smaller and more predictable native footprint, which is what matters when the ceiling
#    is physical RAM rather than a large machine.
#
# 3. **The zram feedback loop.** This is the actual failure. When demand exceeds physical
#    RAM, the kernel moves pages into zram — which is *itself* backed by RAM. Each miss
#    therefore consumes RAM to compress into RAM, so reclaim never converges and the
#    system oscillates. The visible symptom is a stalled CPU-time counter on the JVM: it is
#    spending its time in the reclaim path, not compiling. `vm.swappiness` tuning alone
#    does not fix this, because the loop is self-sustaining once entered.
#
# The cure is to keep total demand *below* physical RAM so zram is never entered. Hence:
# one worker, one GC, and a hard heap ceiling. `scripts/release-build.sh` adds a cgroup
# memory cap on top, which converts "wedged machine" into "build fails fast".
#
# `org.gradle.workers.max=1` also slows multi-module builds noticeably. Raise it to 2 if
# you move to a machine with more than 24 GB; never leave it unset on a 16-thread CPU with
# a JVM that minifies.

org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8

# One worker, no parallelism. The single most important line in this file; see (1) above.
org.gradle.workers.max=1
org.gradle.parallel=false

# Reuse the daemon between builds. Starting fresh each time means a cold, unshrunk heap and
# repeated R8 work; this is most of the difference between a 6-minute and a 20-minute release
# build once the configuration is warm.
org.gradle.daemon=true

# The Kotlin compile daemon is a *separate* JVM. Left unbounded it becomes a second hidden
# multi-gigabyte process, which is exactly the multi-process demand the ceiling above is
# meant to prevent.
kotlin.daemon.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=512m

# Configuration cache: skips a large amount of repeated model-building work, and therefore
# peak allocation, on every subsequent invocation.
org.gradle.configuration-cache=true
org.gradle.caching=true

# VFS watching keeps a second copy of the build state resident. The saving is small; the
# memory is not, when the budget is this tight.
org.gradle.vfs.watch=false

# ==============================================================================
# Android
# ==============================================================================

android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 as a single worker process. Without this, `org.gradle.workers.max` bounds the task
# executor but not the R8 process pool, and R8 can still fan out internally.
android.r8.maxWorkers=1

# ==============================================================================
# Kotlin
# ==============================================================================

kotlin.code.style=official
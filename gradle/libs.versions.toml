[versions]
injekt = "2.0.0-ALPHA-03"
preference = "1.2.1"
agp = "8.7.3"
# OkHttp 5.x (required for Anikku extension compatibility) ships Kotlin 2.2
# metadata, so the whole toolchain moves with it.
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
# Room 2.6.x predates Kotlin 2.2: its KSP processor fails with
# "unexpected jvm signature V" while reading Kotlin 2.2 metadata.
room = "2.8.5"
work = "2.10.0"
media3 = "1.5.1"
coil = "2.7.0"
palette = "1.0.0"
# 3.8.0 needs Kotlin 2.4 metadata; 3.0.0 is the newest built for Kotlin 2.0.x.
supabase = "3.0.0"
browser = "1.8.0"
robolectric = "4.14.1"
# Kept in lockstep with okhttp: a mismatched MockWebServer cannot parse the
# HTTP the client sends.
mockwebserver = "5.3.2"
# Room 2.8.x deserialises its schema bundle with a serializer that calls
# `typeParametersSerializers()`, added in serialization 1.8. Against 1.7.3 the test
# APK dies with AbstractMethodError the first time MigrationTestHelper reads a schema.
serialization = "1.9.0"
coroutines = "1.9.0"
# Anikku extensions are built against OkHttp 5.x; a 4.x host would fail on
# binary-incompatible signatures.
okhttp = "5.3.2"
jsoup = "1.23.2"
datastore = "1.1.1"
# RxJava 1.x: Anikku's AnimeSource declares `rx.Observable` methods and extensions
# are compiled against them, so the host must ship the same artifact.
rxjava = "1.3.8"


[libraries]
# Aniyomi/Anikku source-api contract: extensions call `uy.kohesive.injekt.InjektKt` for
# configuration, so the host must provide it or no real extension can link.
injekt-core = { group = "uy.kohesive.injekt", name = "injekt-core", version.ref = "injekt" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-palette = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt", name = "coil-video", version.ref = "coil" }

supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-kt = { group = "io.github.jan-tennert.supabase", name = "supabase-kt" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
# Stream encode/decode for extensions: keiyoushi-based sources call
# Json.decodeFromStream, whose impl lives in this artifact since 1.8 — without
# it the call dies as NoClassDefFoundError inside the loaded extension.
kotlinx-serialization-json-okio = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-okio", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
rxjava = { group = "io.reactivex", name = "rxjava", version.ref = "rxjava" }

junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-testrunner = { group = "androidx.test", name = "runner", version = "1.6.2" }
androidx-testext-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }